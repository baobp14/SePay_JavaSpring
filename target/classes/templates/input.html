<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Khởi tạo đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow p-4 border-0">
        <h3 class="text-center fw-bold text-primary mb-4">TẠO ĐƠN HÀNG</h3>
        <form th:action="@{/generate-qr}" method="post">
            <div class="mb-3">
                <label class="form-label">Số tiền muốn thanh toán:</label>
                <input type="number" name="amount" class="form-control" placeholder="Ví dụ: 100000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Mã đơn hàng (Nội dung):</label>
                <input type="text" name="description" class="form-control" placeholder="Ví dụ: BAO99" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">TẠO MÃ QR THANH TOÁN 🚀</button>
        </form>
    </div>
</div>
</body>
</html>
